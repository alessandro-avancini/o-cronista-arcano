[project]
name = "o-cronista-arcano"
version = "0.1.0"
description = "RAG para mestres de RPG - transcrição e memória vetorial de sessões"
requires-python = ">=3.12,<3.13"
dependencies = [
    "chromadb>=0.4.0",
    "fastapi>=0.115.0",
    "google-genai>=1.46.0",
    "langchain-text-splitters>=0.3.0",
    "ollama>=0.6.0",
    "pydub>=0.25.1",
    "python-dotenv>=1.0.0",
    "sentence-transformers>=5.0.0",
    "strands-agents[ollama]>=0.1.0",
    "uvicorn[standard]>=0.32.0",
    "yt-dlp>=2025.10.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
markers = ["slow: marks tests that need Ollama and full ingest (deselect with -m 'not slow')"]